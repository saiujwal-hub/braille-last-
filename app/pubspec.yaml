name: braille_bridge
description: Offline slate-and-stylus Braille reader - camera to text to speech.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  http: ^1.2.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
